services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: marketpulse
      POSTGRES_USER: marketpulse
      POSTGRES_PASSWORD: marketpulse
      PGTZ: UTC
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata_marketpulse:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketpulse -d marketpulse"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata_marketpulse: {}